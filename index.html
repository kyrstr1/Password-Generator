<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Password Generator</title>
</head>
<body id="top">
  <main>
    <section class="hero-section d-flex justify-content-center align-items-center" id="section_1">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>
      <div class="container position-relative">
        <div class="row">
          <div class="col-xl-8 col-lg-9 col-12 mx-auto">
            <div class="generator-card">
              <div class="eyebrow"><span class="eyebrow-dot"></span></div>
              <h1 class="text-center">Create your password</h1>
              <p class="intro text-center">Build a strong, unique password in a single click.</p>
              <div class="control-group">
                <label for="txtPassword">Password characters</label>
                <input type="text" class="form-control text-center" id="txtPassword" value="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%&amp;*()-_=+[]{}&lt;&gt;?">
                <span class="field-hint">Customize the character set used in every generation.</span>
              </div>
              <div class="control-group length-group">
                <label>Select password length</label>
                <div class="length-buttons" role="group" aria-label="Password length">
                  <button type="button" class="btn btn-light" id="btn8">8 <span>chars</span></button>
                  <button type="button" class="btn btn-light" id="btn12">12 <span>chars</span></button>
                  <button type="button" class="btn btn-light" id="btn16">16 <span>chars</span></button>
                </div>
              </div>
              <div class="generated-panel">
                <div class="panel-label"><span class="lock-icon">✦</span> Your secure password</div>
                <input id="sonuc" class="text-center" aria-label="Generated password" title="Copied to clipboard!" placeholder="Choose a length above" readonly>
                <p class="copy-note">Tap the password to copy it to your clipboard.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container"><div class="footer-content">
      <div><p class="footer-kicker">PASSWORD GENERATOR</p><p class="footer-text">Simple, private password generation.</p></div>
      <nav aria-label="Contact links">
        <a href="mailto:mhmtkyrstr@gmail.com">Email</a>
        <a href="https://github.com/kyrstr1">GitHub</a>
        <a href="https://www.instagram.com/kayrasatir/">Instagram</a>
        <a href="https://buymeacoffee.com/kayrasatir">Support</a>
      </nav>
    </div></div>
  </footer>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
